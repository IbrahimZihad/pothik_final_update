# Edge reverse proxy for POTHIK.
# Mounted at /etc/nginx/conf.d/default.conf inside the `nginx` service.
#
# - /api, /uploads, /api-docs, /openapi.json and /health go to the API replicas
# - everything else is served by the frontend container (SPA with history fallback)
# - add more `server api-N:5000;` lines as you scale the API

map $http_x_request_id $pothik_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

upstream pothik_api {
    least_conn;
    server api-1:5000 max_fails=3 fail_timeout=10s;
    server api-2:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream pothik_web {
    server frontend:80;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://pothik_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $pothik_request_id;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://pothik_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        expires 7d;
    }

    location /api-docs {
        proxy_pass http://pothik_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /openapi.json {
        proxy_pass http://pothik_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /health {
        proxy_pass http://pothik_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://pothik_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $pothik_request_id;
        proxy_set_header Connection "";
    }
}

