name: pothik

# Deployment topology: two or more stateless API replicas behind Nginx, a
# dedicated BullMQ worker, MySQL as the source of truth and Redis for jobs and
# cache. See docs/DEPLOYMENT.md and docs/LOAD_BALANCING.md.
#
#   cp deployment/.env.example deployment/.env   # then fill in real secrets
#   docker compose -f deployment/docker-compose.yml up -d --build
#
# Scale by adding api-3/api-4 services (same anchor) and listing them in
# deployment/nginx/pothik.conf, then reload Nginx.

x-backend: &backend
  build:
    context: ../backend
  image: pothik-api:1.0.0

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-production}
  PORT: "5000"
  API_PREFIX: /api/v1
  APP_URL: ${PUBLIC_URL:-http://localhost}
  API_URL: ${PUBLIC_URL:-http://localhost}
  CORS_ORIGINS: ${PUBLIC_URL:-http://localhost}
  DB_DIALECT: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: ${MYSQL_DATABASE:-pothik}
  DB_USER: ${MYSQL_USER:-pothik_app}
  DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in deployment/.env}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  REDIS_URL: redis://redis:6379
  QUEUE_ENABLED: "true"
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in deployment/.env}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in deployment/.env}
  ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
  PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-sslcommerz}
  PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:?set PAYMENT_CALLBACK_SECRET in deployment/.env}
  SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID:-}
  SSLCOMMERZ_STORE_PASSWORD: ${SSLCOMMERZ_STORE_PASSWORD:-}
  SSLCOMMERZ_SANDBOX: ${SSLCOMMERZ_SANDBOX:-true}
  PLATFORM_COMMISSION_RATE: ${PLATFORM_COMMISSION_RATE:-10}
  HOTEL_COMMISSION_RATE: ${HOTEL_COMMISSION_RATE:-12}
  TRANSPORT_COMMISSION_RATE: ${TRANSPORT_COMMISSION_RATE:-10}
  GUIDE_COMMISSION_RATE: ${GUIDE_COMMISSION_RATE:-10}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  ADMIN_NAME: ${ADMIN_NAME:-Platform Administrator}
  SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
  UPLOAD_DIR: /app/uploads
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
  RATE_LIMIT_WINDOW_MINUTES: ${RATE_LIMIT_WINDOW_MINUTES:-15}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}

x-api-service: &api-service
  <<: [*backend, *logging]
  restart: unless-stopped
  environment: *api-env
  volumes:
    - uploads:/app/uploads
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-300}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deployment/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pothik}
      MYSQL_USER: ${MYSQL_USER:-pothik_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in deployment/.env}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    <<: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    <<: *logging

  migrate:
    <<: [*backend, *logging]
    environment: *api-env
    command: ["node", "src/database/cli.js", "migrate"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  # Opt-in demo data: docker compose --profile seed run --rm seed
  seed:
    <<: [*backend, *logging]
    environment: *api-env
    command: ["node", "src/database/cli.js", "seed"]
    restart: "no"
    profiles: ["seed"]
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api-1:
    <<: *api-service

  api-2:
    <<: *api-service

  worker:
    <<: *api-service
    command: ["node", "src/infrastructure/jobs/worker.js"]

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: /api/v1
        VITE_SITE_URL: ${PUBLIC_URL:-http://localhost}
    image: pothik-web:1.0.0
    restart: unless-stopped
    expose:
      - "80"
    <<: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      # - "${HTTPS_PORT:-443}:443"   # enable together with the TLS block in nginx/pothik.conf
    volumes:
      - ./nginx/pothik.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api-1
      - api-2
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 3s
      retries: 3
    <<: *logging

volumes:
  mysql_data:
  redis_data:
  uploads:
